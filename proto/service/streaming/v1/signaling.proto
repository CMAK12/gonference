syntax = "proto3";

package gonference.signaling.v1;

service Signaling {
  rpc Connect(stream SignalMessage) returns (stream SignalMessage);
}

message SignalMessage {
  MessageType type = 1;
  string room_id = 2;
  string member_id = 3;
  optional string sdp = 4;
  optional ICECandidate candidate = 5;
}

enum MessageType {
  OFFER = 0;
  ANSWER = 1;
  CANDIDATE = 2;
  LEAVE = 3;
}

message ICECandidate {
  string candidate = 1;
  optional string sdp_mid = 2;
  optional uint32 sdp_mline_index = 3;
  optional string username_fragment = 4;
}