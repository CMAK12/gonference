syntax = "proto3";

package gonference.signaling.v1;

import "buf/validate/validate.proto";

service Signaling {
  rpc Connect(SignalMessage) returns (SignalMessage);
}

message SignalMessage {
  MessageType type = 1 [(buf.validate.field).enum = {in: [0]}];
  string room_id = 2 [(buf.validate.field).required = true];
  string member_id = 3 [(buf.validate.field).required = true];
  optional string sdp = 4 [(buf.validate.field).string.min_len = 1, (buf.validate.field).required = true];
  optional ICECandidate candidate = 5;
}

enum MessageType {
  OFFER = 0;
  ANSWER = 1;
  CANDIDATE = 2;
  LEAVE = 3;
}

message ICECandidate {
  string candidate = 1;
  optional string sdp_mid = 2;
  optional uint32 sdp_mline_index = 3;
  optional string username_fragment = 4;
}