<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferences</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        h1 { margin: 0 0 24px; font-size: 24px; }
        h2 { margin: 32px 0 12px; font-size: 16px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            margin-bottom: 12px;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #d2d2d7;
            border-radius: 6px;
            font: inherit;
        }

        button {
            padding: 8px 14px;
            border: 0;
            border-radius: 6px;
            background: #0071e3;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        button:hover { background: #0077ed; }
        button.secondary { background: #e8e8ed; color: #1d1d1f; }
        button.secondary:hover { background: #dedee3; }

        .conference-name { font-weight: 600; margin-bottom: 4px; }
        .conference-id { font-size: 12px; color: #888; font-family: ui-monospace, monospace; margin-bottom: 8px; }
        .members { font-size: 14px; color: #555; margin-bottom: 12px; }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body data-rest-port="{{.RestPort}}">
<main>
    <h1>Conferences</h1>

    <div class="card">
        <h2 style="margin-top:0">Create a new conference</h2>
        <form id="create-form" class="row">
            <input type="text" id="create-name" placeholder="Conference name" required>
            <button type="submit">Create</button>
        </form>
    </div>

    <h2>Active conferences</h2>
    <div id="conferences">
        {{if .Conferences}}
            {{range .Conferences}}
                <div class="card" data-id="{{.ID}}">
                    <div class="conference-name">{{.Name}}</div>
                    <div class="conference-id">{{.ID}}</div>
                    <div class="members">
                        {{if .Members}}
                            Members: {{range $i, $m := .Members}}{{if $i}}, {{end}}{{$m}}{{end}}
                        {{else}}
                            <span class="empty">No members yet</span>
                        {{end}}
                    </div>
                    <form class="join-form row" data-id="{{.ID}}">
                        <input type="text" name="username" placeholder="Your name" required>
                        <button type="submit">Join</button>
                    </form>
                </div>
            {{end}}
        {{else}}
            <div class="card empty">No conferences yet — create one above.</div>
        {{end}}
    </div>
</main>

<script>
    const restPort = document.body.dataset.restPort;
    const restBase = `http://${location.hostname}:${restPort}`;

    document.getElementById("create-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("create-name").value.trim();
        if (!name) return;
        const res = await fetch(`${restBase}/conference/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name }),
        });
        if (!res.ok) {
            alert(`Failed to create: ${res.status} ${await res.text()}`);
            return;
        }
        location.reload();
    });

    document.querySelectorAll(".join-form").forEach((form) => {
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const id = form.dataset.id;
            const username = form.querySelector('input[name="username"]').value.trim().replace(/\s+/g, '_');
            if (!username) return;
            window.location = `/conference/${encodeURIComponent(id)}?username=${encodeURIComponent(username)}`;
        });
    });
</script>
</body>
</html>
