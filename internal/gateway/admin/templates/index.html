<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Conference</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #000;
        }

        .videos {
            display: grid;
            width: 100vw;
            height: 100vh;

            gap: 8px;
            padding: 8px;
            box-sizing: border-box;

            transition:
                    grid-template-columns 300ms ease,
                    grid-template-rows 300ms ease;
        }

        /* видео */
        .video {
            position: relative;
            width: 100%;
            height: 100%;
            background: black;

            overflow: hidden;
            border-radius: 6px;

            transform: scale(1);
            transition:
                    transform 250ms ease,
                    opacity 250ms ease;
        }

        .video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* появление */
        .video.enter {
            opacity: 0;
            transform: scale(0.95);
        }

        .video.enter-active {
            opacity: 1;
            transform: scale(1);
        }

    </style>
</head>
<body>

<div id="videos" class="grid"></div>

<script type="module" src="../static/app.js"></script>
</body>
</html>
