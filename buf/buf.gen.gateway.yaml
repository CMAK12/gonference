version: v2

managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package
      value: github.com/CMAK12/gonference/internal/gen/gateway/v1;gateway

plugins:
  - local: protoc-gen-go
    out: ../internal/gen
    opt: paths=source_relative

  - local: protoc-gen-go-grpc
    out: ../internal/gen
    opt: paths=source_relative

inputs:
  - directory: ../proto/api
