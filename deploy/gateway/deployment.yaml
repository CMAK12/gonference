apiVersion: apps/v1
kind: Deployment

metadata:
    name: gateway-service

spec:
    replicas: 1

    selector:
        matchLabels:
            app: gateway-service
    template:
        metadata:
            labels:
                app: gateway-service

        spec:
            containers:
                -   name: gateway-service
                    image: gonference-gateway:v1
                    imagePullPolicy: IfNotPresent
                    ports:
                        -   containerPort: 10001
                    envFrom:
                        -   configMapRef:
                                name: gateway-config
                        -   secretRef:
                                name: gateway-secret
                    resources:
                        requests:
                            cpu: "100m"
                            memory: "128Mi"
                        limits:
                            cpu: "500m"
                            memory: "512Mi"
                    livenessProbe:
                        grpc:
                            port: 10001

                        initialDelaySeconds: 30
                        periodSeconds: 10
                        failureThreshold: 3
                    readinessProbe:
                        grpc:
                            port: 10001

                        initialDelaySeconds: 30
                        periodSeconds: 10