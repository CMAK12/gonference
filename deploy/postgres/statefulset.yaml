apiVersion: apps/v1
kind: StatefulSet

metadata:
    name: postgres

spec:
    serviceName: postgres
    replicas: 1

    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres

        spec:
            containers:
                -   name: postgres
                    image: postgres:18
                    imagePullPolicy: IfNotPresent
                    ports:
                        -   containerPort: 5432
                    env:
                        -   name: POSTGRES_DB
                            value: gonference
                        -   name: POSTGRES_USER
                            valueFrom:
                                secretKeyRef:
                                    name: postgres-secret
                                    key: POSTGRES_USER
                        -   name: POSTGRES_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: postgres-secret
                                    key: POSTGRES_PASSWORD
                    volumeMounts:
                        -   name: data
                            mountPath: /var/lib/postgresql
                    resources:
                        requests:
                            cpu: "100m"
                            memory: "256Mi"
                        limits:
                            cpu: "1"
                            memory: "1Gi"
                    livenessProbe:
                        exec:
                            command: ["pg_isready", "-U", "admin", "-d", "gonference"]

                        initialDelaySeconds: 30
                        periodSeconds: 10
                        failureThreshold: 3
                    readinessProbe:
                        exec:
                            command: ["pg_isready", "-U", "admin", "-d", "gonference"]

                        initialDelaySeconds: 20
                        periodSeconds: 10

    volumeClaimTemplates:
        -   metadata:
                name: data
            spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                    requests:
                        storage: 5Gi