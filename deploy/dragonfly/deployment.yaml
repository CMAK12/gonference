apiVersion: apps/v1
kind: Deployment

metadata:
    name: dragonfly

spec:
    replicas: 1

    selector:
        matchLabels:
            app: dragonfly
    template:
        metadata:
            labels:
                app: dragonfly

        spec:
            containers:
                -   name: dragonfly
                    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
                    imagePullPolicy: IfNotPresent
                    args:
                        - "--dir=/data"
                    ports:
                        -   containerPort: 6379
                    volumeMounts:
                        -   name: data
                            mountPath: /data
                    resources:
                        requests:
                            cpu: "100m"
                            memory: "256Mi"
                        limits:
                            cpu: "1"
                            memory: "1Gi"
                    livenessProbe:
                        tcpSocket:
                            port: 6379

                        initialDelaySeconds: 5
                        periodSeconds: 10
                        failureThreshold: 3
                    readinessProbe:
                        exec:
                            command: ["redis-cli", "ping"]

                        initialDelaySeconds: 3
                        periodSeconds: 5
            volumes:
                -   name: data
                    emptyDir: {}