apiVersion: apps/v1
kind: Deployment

metadata:
    name: conference-service

spec:
    replicas: 2

    selector:
        matchLabels:
            app: conference-service
    template:
        metadata:
            labels:
                app: conference-service

        spec:
            containers:
                -   name: conference-service
                    image: gonference-conference:v1
                    imagePullPolicy: IfNotPresent
                    ports:
                        -   containerPort: 10002
                    envFrom:
                        -   configMapRef:
                                name: conference-config
                        -   secretRef:
                                name: conference-secret
                    resources:
                        requests:
                            cpu: "100m"
                            memory: "128Mi"
                        limits:
                            cpu: "500m"
                            memory: "512Mi"
                    livenessProbe:
                        grpc:
                            port: 10002

                        initialDelaySeconds: 5
                        periodSeconds: 4
                        failureThreshold: 3
                    readinessProbe:
                        grpc:
                            port: 10002

                        initialDelaySeconds: 5
                        periodSeconds: 4